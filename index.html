<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>挪车通知</title>
  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }
    .card {
      max-width: 360px;
      margin: 50px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 16px;
    }
    h1 {
      color: #222;
    }
    p {
      color: #666;
      line-height: 1.8;
    }
    a {
      display: block;
      margin-top: 25px;
      padding: 16px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>您好，麻烦挪一下车</h1>
    <p>如果我的车辆影响了您的通行，<br>请点击下方按钮联系车主。</p>
    <a href="tel:15138356813">联系车主</a>
  </div>
</body>
</html>
